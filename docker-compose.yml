services:
  app:
    image: "${IMAGE_NAME}:${IMAGE_TAG}"
    container_name: core-web-app
    build:
      dockerfile: Dockerfile
      args:
        - APP_VERSION
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./package.json
    ports:
      - "127.0.0.1:3000:8000"
    env_file:
      - .env
      - .env.development
      - .env.development.local
    restart: unless-stopped
