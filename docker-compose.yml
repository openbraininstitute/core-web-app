services:
  app:
    image: '${IMAGE_NAME}:${IMAGE_TAG}'
    container_name: core-web-app
    pull_policy: build
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - APP_VERSION
    develop:
      watch:
        - action: rebuild
          path: ./apps/web/src
        - action: rebuild
          path: ./apps/web/package.json
    ports:
      - '127.0.0.1:3000:8000'
    env_file:
      - apps/web/.env
      - apps/web/.env.development
      - path: apps/web/.env.development.local
        required: false
    restart: unless-stopped
