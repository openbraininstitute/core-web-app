pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,jsx,ts,tsx}'
      run: npx eslint {staged_files}
    prettier:
      glob: '*.{js,jsx,ts,tsx,json}'
      run: |
        npx prettier --write {staged_files}
        git add {staged_files}
    typescript:
      glob: '*.{js,jsx,ts,tsx}'
      run: npx tsc --noEmit
