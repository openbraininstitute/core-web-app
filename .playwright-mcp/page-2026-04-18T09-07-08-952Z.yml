                  - heading "Data" [level=4] [ref=e116]
                  - generic [ref=e117]: H01_v1
                  - paragraph [ref=e118]: The H01 dataset is a computational reconstruction of one sample of human temporal cortex, representing 1 mm³ of brain tissue, surgically removed to gain access to an underlying epileptic focus. It was imaged at nanoscale resolution using serial section electron microscopy and provides a detailed map of human cortical circuitry at the synaptic level. It contains approximately 57,000 cells (out of which 104 have been fully proofread), ~230 mm of blood vessels, ~150 million synapses, and comprises 1.4 petabytes This version represents a smaller circuit in SONATA format. It includes 88 proofread cell morphologies together with their spines and the connectivity within a bounding box surrounding these cells, covering approximately 0.3 μm³. In addition, the circuit captures the extrinsic connectivity of the fully reconstructed cells—that is, their connections originating from outside the bounding volume. If you would like to use this dataset, please credit the original data aggregators, as well as the OBI platform and the OBI members responsible for curating this version.
