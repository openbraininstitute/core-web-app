name: PR checks

on:
  push:
    branches:
      - "*"
      - "!main"
      - "!develop"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      # app code lives under apps/; a branch merged across the monorepo move without
      # scripts/monorepo/move.sh port can leave files in the old root folders
      - name: No app files at the repository root
        run: |
          for d in src public types; do
            if [ -e "$d" ]; then echo "::error::$d/ must live under apps/web/ (see scripts/monorepo/move.sh)"; exit 1; fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run linter
        run: pnpm run ci
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build app
        run: pnpm turbo run build
