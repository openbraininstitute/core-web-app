name: Make release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.PUBLICECR_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get full history to check existing tags

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine new tag
        id: tag
        run: |
          YEAR=$(date +'%Y')
          MONTH=$(date +'%m')
          DAY=$(date +'%d')
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^${YEAR}\.${MONTH}\.${DAY}\.[0-9]+$" | head -n 1 || echo "")

          if [[ -z "$LATEST_TAG" ]]; then
            COUNTER=1
          else
            COUNTER=$(( ${LATEST_TAG##*.} + 1 ))
          fi

          NEW_TAG="${YEAR}.${MONTH}.${DAY}.${COUNTER}"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          echo "New tag: $NEW_TAG"

      - name: Create Git Tag
        run: |
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Extract version
        run: |
          APP_VERSION=$(make version)
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "Using app version: ${APP_VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PUBLICECR_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PUBLICECR_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.PUBLICECR_REGION }}

      - name: Authenticate with AWS Public ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and publish Docker image for AWS
        run: make publish

      - name: Extract static assets from Docker image
        run: |
          # Remove directory for extracted assets (can be removed later)
          rm -rf ./assets-for-s3

          # Create directory for extracted assets with versioned paths
          mkdir -p ./assets-for-s3/${APP_VERSION}/public
          mkdir -p ./assets-for-s3/${APP_VERSION}/_next

          # Create temporary container and extract static assets
          docker create --name assets-extractor ${{ vars.PUBLICECR_URI }}:${APP_VERSION}
          docker cp assets-extractor:/app/.next/static ./assets-for-s3/${APP_VERSION}/_next/static/
          docker cp assets-extractor:/app/public ./assets-for-s3/${APP_VERSION}/public/
          docker rm assets-extractor

      - name: Sync static assets to S3 and invalidate CloudFront
        run: |
          # Uploading STAGING CDN assets
          aws s3 sync ./assets-for-s3/${APP_VERSION}/public s3://${{ vars.STAGING_S3_BUCKET_NAME }}/${APP_VERSION}/public --delete --exact-timestamps --cache-control "public, max-age=604800, immutable"
          aws s3 sync ./assets-for-s3/${APP_VERSION}/_next/static s3://${{ vars.STAGING_S3_BUCKET_NAME }}/${APP_VERSION}/_next/static --delete --exact-timestamps --cache-control "public, max-age=604800, immutable"

          # Uploading PRODUCTION CDN assets
          aws s3 sync ./assets-for-s3/${APP_VERSION}/public s3://${{ vars.PRODUCTION_S3_BUCKET_NAME }}/${APP_VERSION}/public --delete --exact-timestamps --cache-control "public, max-age=604800, immutable"
          aws s3 sync ./assets-for-s3/${APP_VERSION}/_next/static s3://${{ vars.PRODUCTION_S3_BUCKET_NAME }}/${APP_VERSION}/_next/static --delete --exact-timestamps --cache-control "public, max-age=604800, immutable"
