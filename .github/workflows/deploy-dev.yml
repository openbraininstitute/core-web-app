name: Deploy to DEV

permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Standard permission for GitHub Actions

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.PUBLICECR_URI }}
      IMAGE_TAG: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::985539765147:role/gh_ecr_push_core-web-app
          aws-region: us-east-1

      - name: Authenticate with AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and publish Docker image for AWS
        run: make publish

      - name: Authenticate with AWS ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_ECS_REDEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_STAGING_REGION }}

      - name: Trigger new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ vars.DEV_ECS_CLUSTER }} \
            --service ${{ vars.DEV_ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait until the service is stable
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.DEV_ECS_CLUSTER }} \
            --service ${{ vars.DEV_ECS_SERVICE }}
