name: test

on:
  push:
    branches:
      - "*"
      - "!main"
  pull_request:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Prepare unit coverage artifact
        if: always()
        run: |
          mkdir -p test-artifacts
          cp coverage/coverage-summary.json test-artifacts/unit-coverage-summary.json || true

      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: test-artifacts/unit-coverage-summary.json
          if-no-files-found: warn

  # renders the unit test results into a report, posts it to the run
  # summary, and (for same-repo PRs) keeps a sticky PR comment up to date
  test-coverage-report:
    name: PR test coverage
    runs-on: ubuntu-latest
    # needs write access to post/update the PR comment; the rest of the workflow
    # stays read-only.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs:
      - test
    # always() so the report is produced even when the unit test job fails
    if: always()
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # continue-on-error: a missing artifact (e.g. the job failed before upload)
      # shouldn't block the report; the render script handles absent inputs
      - name: Download unit coverage artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: unit-coverage
          path: test-artifacts

      - name: Render test coverage report
        env:
          UNIT_JOB_STATUS: ${{ needs.test.result }}
          UNIT_COVERAGE_SUMMARY_PATH: test-artifacts/unit-coverage-summary.json
          REPORT_PATH: test-coverage-report.md
        run: node scripts/ci/render-test-coverage-report.mjs

      - name: Add report to workflow summary
        run: cat test-coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # only on same-repo PRs: fork PRs lack the pull-requests:write token, and
      # there's no PR to comment on for branch pushes or manual runs
      - name: Update PR test coverage comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            // Hidden marker used to locate and update our existing comment
            // instead of posting a new one on every run.
            const marker = '<!-- obi-test-coverage-report -->';
            const body = fs.readFileSync('test-coverage-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            // Upsert: edit the marked comment if present, otherwise create one.
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
