name: test

on:
  push:
    branches:
      - "*"
      - "!main"
  pull_request:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Prepare unit coverage artifact
        if: always()
        run: |
          mkdir -p test-artifacts
          cp coverage/coverage-summary.json test-artifacts/unit-coverage-summary.json || true

      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: test-artifacts/unit-coverage-summary.json
          if-no-files-found: warn

  # provisions exactly one virtual lab/project for the whole E2E workflow
  # matrix jobs authenticate separately but reuse this same provisioned state
  # TODO: we may either use different users per os/browser
  # or use the same user but each os/browser uses separate project
  e2e-provision:
    name: E2E provision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # skip on pull requests from forks: forked PRs don't get access to the repository secrets below
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CI: true
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # keep the provisioned lab alive after auth-setup. the final e2e-cleanup
      # job is responsible for deleting it after all browser matrix legs finish
      E2E_DISABLE_AUTH_SETUP_TEARDOWN: "true"
      # store provision output in test-artifacts so we can upload a sanitized
      # state artifact for the parallel matrix jobs
      E2E_AUTH_STATE_PATH: test-artifacts/e2e-provision/auth/user.json
      E2E_STATE_PATH: test-artifacts/e2e-provision/state.json
      PLAYWRIGHT_BROWSER: chromium
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Chrome for auth setup
        run: pnpm exec playwright install --with-deps chrome

      - name: Authenticate and provision virtual lab
        run: pnpm exec playwright test --project=auth-setup --reporter=list

      - name: Prepare provisioned E2E state artifact
        run: |
          mkdir -p test-artifacts/e2e-state
          node <<'NODE'
          const fs = require('node:fs');

          const sourcePath = process.env.E2E_STATE_PATH;
          const targetPath = 'test-artifacts/e2e-state/state.json';
          const state = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          // the matrix only needs stable workspace IDs. each job logs in again
          // for its own browser session, so never put bearer tokens in artifacts
          delete state.accessToken;
          fs.writeFileSync(targetPath, JSON.stringify(state, null, 2));
          NODE

      - name: Upload provisioned E2E state
        uses: actions/upload-artifact@v7
        with:
          name: e2e-provisioned-state
          path: test-artifacts/e2e-state/state.json
          retention-days: 1
          if-no-files-found: error

  # runs the public/private E2E suites across the browser/OS matrix. each matrix
  # leg logs in with the same test user, then reuses the single provisioned
  # virtual lab/project from e2e-provision
  e2e-tests:
    name: E2E tests (${{ matrix.os }} / ${{ matrix.browser-label }})
    needs:
      - e2e-provision
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      # let every matrix combination finish even if one fails, so we can upload all artifacts
      fail-fast: false
      matrix:
        # each entry pairs a runner OS with a playwright engine. `playwright-browser`
        # is the engine name, `playwright-channel` selects a branded channel (e.g. real Chrome)
        # and is empty for bundled engines, and `install-target` is what `playwright install` downloads
        include:
          - os: ubuntu-latest
            browser: chrome
            browser-label: Chrome
            playwright-browser: chromium
            playwright-channel: chrome
            install-target: chrome
          - os: ubuntu-latest
            browser: firefox
            browser-label: Firefox
            playwright-browser: firefox
            playwright-channel: ""
            install-target: firefox
          - os: ubuntu-latest
            browser: safari
            browser-label: Safari (WebKit)
            playwright-browser: webkit
            playwright-channel: ""
            install-target: webkit
          - os: macos-latest
            browser: chrome
            browser-label: Chrome
            playwright-browser: chromium
            playwright-channel: chrome
            install-target: chrome
    env:
      CI: true
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # the matrix still runs auth-setup as a project dependency so each browser
      # gets a fresh storageState file. auth-only mode stops setup from creating
      # another virtual lab, because the user may own only one
      E2E_AUTH_ONLY: "true"
      E2E_DISABLE_AUTH_SETUP_TEARDOWN: "true"
      E2E_STATE_PATH: test-artifacts/e2e-state/state.json
      # unique per matrix leg so parallel jobs don't clobber each other's artifacts
      E2E_ARTIFACT_SLUG: ${{ matrix.os }}-${{ matrix.browser }}
      PLAYWRIGHT_BROWSER: ${{ matrix.playwright-browser }}
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ matrix.playwright-channel }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Validate E2E secrets
        run: |
          missing=()
          if [[ -z "$E2E_TEST_USERNAME" ]]; then
            missing+=(E2E_TEST_USERNAME)
          fi
          if [[ -z "$E2E_TEST_PASSWORD" ]]; then
            missing+=(E2E_TEST_PASSWORD)
          fi

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download provisioned E2E state
        uses: actions/download-artifact@v7
        with:
          name: e2e-provisioned-state
          path: test-artifacts/e2e-state

      # Linux needs browser binaries plus os dependencies, macOS chrome jobs use
      # the hosted runner's preinstalled Google Chrome; `playwright install chrome`
      # removes `/Applications/Google Chrome.app` before downloading a dmg, which
      # makes the job brittle when the download endpoint is unavailable
      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_INSTALL_TARGET: ${{ matrix.install-target }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pnpm exec playwright install --with-deps "$PLAYWRIGHT_INSTALL_TARGET"
          elif [[ "$PLAYWRIGHT_INSTALL_TARGET" == "chrome" ]]; then
            chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
            if [[ ! -x "$chrome" ]]; then
              printf '::error::Google Chrome is not installed at %s\n' "$chrome"
              exit 1
            fi
            "$chrome" --version
          else
            pnpm exec playwright install "$PLAYWRIGHT_INSTALL_TARGET"
          fi

      # match the worker count to the runner's available CPUs and expose it as a
      # step output for the test command below
      - name: Resolve Playwright workers
        id: playwright-workers
        run: |
          echo "count=$(node -e "console.log(require('node:os').availableParallelism())")" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests headlessly
        env:
          PLAYWRIGHT_WORKERS: ${{ steps.playwright-workers.outputs.count }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-artifacts/e2e-results-${{ matrix.os }}-${{ matrix.browser }}.json
        run: |
          mkdir -p test-artifacts
          pnpm exec playwright test --project=public --project=private --reporter=list,json

      # record the matrix context alongside the results so the report job can label each leg correctly.
      # runs even on failure to keep reports complete
      - name: Prepare E2E metadata
        if: always()
        env:
          PLAYWRIGHT_WORKERS: ${{ steps.playwright-workers.outputs.count }}
          E2E_OS: ${{ matrix.os }}
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_BROWSER_LABEL: ${{ matrix.browser-label }}
          E2E_PLAYWRIGHT_BROWSER: ${{ matrix.playwright-browser }}
          E2E_PLAYWRIGHT_CHANNEL: ${{ matrix.playwright-channel }}
        run: |
          mkdir -p test-artifacts
          node <<'NODE'
          const fs = require('node:fs');

          fs.writeFileSync(
            `test-artifacts/e2e-metadata-${process.env.E2E_ARTIFACT_SLUG}.json`,
            JSON.stringify(
              {
                os: process.env.E2E_OS,
                browser: process.env.E2E_BROWSER,
                browserLabel: process.env.E2E_BROWSER_LABEL,
                playwrightBrowser: process.env.E2E_PLAYWRIGHT_BROWSER,
                playwrightChannel: process.env.E2E_PLAYWRIGHT_CHANNEL || null,
                workers: process.env.PLAYWRIGHT_WORKERS,
              },
              null,
              2
            )
          );
          NODE

      - name: Upload E2E report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            test-artifacts/e2e-results-${{ matrix.os }}-${{ matrix.browser }}.json
            test-artifacts/e2e-metadata-${{ matrix.os }}-${{ matrix.browser }}.json
            test-results/
            playwright-report/
          if-no-files-found: warn

  # always attempts to delete the single E2E virtual lab after the browser matrix
  # finishes. it logs in again for a fresh token instead of relying on an
  # uploaded auth state
  e2e-cleanup:
    name: E2E cleanup
    needs:
      - e2e-provision
      - e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      CI: true
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # cleanup-only mode authenticates for a fresh token, deletes the
      # provisioned virtual lab from the downloaded state, and exits before
      # creating a replacement lab
      E2E_CLEANUP_ONLY: "true"
      E2E_DISABLE_AUTH_SETUP_TEARDOWN: "true"
      E2E_AUTH_STATE_PATH: test-artifacts/e2e-cleanup-auth/user.json
      E2E_STATE_PATH: test-artifacts/e2e-state/state.json
      PLAYWRIGHT_BROWSER: chromium
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download provisioned E2E state
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: e2e-provisioned-state
          path: test-artifacts/e2e-state

      - name: Install Chrome for cleanup
        run: pnpm exec playwright install --with-deps chrome

      - name: Delete E2E virtual lab
        run: pnpm exec playwright test --project=auth-setup --reporter=list

  # aggregates unit + e2e results into a single report, posts it to the run
  # summary, and (for same-repo PRs) keeps a sticky PR comment up to date
  test-coverage-report:
    name: PR test coverage
    runs-on: ubuntu-latest
    # needs write access to post/update the PR comment; the rest of the workflow
    # stays read-only.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs:
      - test
      - e2e-tests
    # always() so the report is produced even when upstream test jobs fail or are skipped (e.g. E2E skipped on fork PRs)
    if: always()
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # continue-on-error: a missing artifact (e.g. the job failed before upload)
      # shouldn't block the report; the render script handles absent inputs
      - name: Download unit coverage artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: unit-coverage
          path: test-artifacts

      # Pull every per-matrix E2E artifact and flatten them into one folder.
      - name: Download E2E report artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: e2e-report-*
          path: test-artifacts
          merge-multiple: true

      - name: Render test coverage report
        env:
          UNIT_JOB_STATUS: ${{ needs.test.result }}
          E2E_JOB_STATUS: ${{ needs.e2e-tests.result }}
          UNIT_COVERAGE_SUMMARY_PATH: test-artifacts/unit-coverage-summary.json
          E2E_RESULTS_PATH: test-artifacts/e2e-results.json
          E2E_METADATA_PATH: test-artifacts/e2e-metadata.json
          REPORT_PATH: test-coverage-report.md
        run: node scripts/ci/render-test-coverage-report.mjs

      - name: Add report to workflow summary
        run: cat test-coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # only on same-repo PRs: fork PRs lack the pull-requests:write token, and
      # there's no PR to comment on for branch pushes or manual runs
      - name: Update PR test coverage comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            // Hidden marker used to locate and update our existing comment
            // instead of posting a new one on every run.
            const marker = '<!-- obi-test-coverage-report -->';
            const body = fs.readFileSync('test-coverage-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            // Upsert: edit the marked comment if present, otherwise create one.
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
