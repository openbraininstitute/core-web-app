name: Check Documentation Updates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    if: ${{ github.base_ref != 'develop' && !contains(github.event.pull_request.labels.*.name, 'skip docs') }}
    steps:
      - name: Debug info
        run: |
          echo "Base ref: ${{ github.base_ref }}"
          echo "Labels: ${{ join(github.event.pull_request.labels.*.name, ', ') }}"
          echo "Has skip docs: ${{ contains(github.event.pull_request.labels.*.name, 'skip docs') }}"

      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for documentation changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^docs/"; then
            echo "✅ Documentation has been updated"
          else
            echo "::error::No documentation changes detected. Please update at least one file in the /docs/ directory or add the 'skip docs' label to skip this check."
            exit 1
          fi
