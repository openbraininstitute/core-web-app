name: Check Documentation Updates

on:
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if on develop branch
        id: check-branch
        run: |
          if [ "${{ github.base_ref }}" == "develop" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for skip docs label
        id: check-label
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' | grep -q "skip docs"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for documentation changes
        if: steps.check-branch.outputs.skip == 'false' && steps.check-label.outputs.skip == 'false'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^docs/"; then
            echo "✅ Documentation has been updated"
          else
            echo "::error::No documentation changes detected. Please update at least one file in the /docs/ directory or add the 'skip docs' label to skip this check."
            exit 1
          fi
