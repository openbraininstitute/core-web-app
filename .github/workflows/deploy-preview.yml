name: Preview

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

env:
  AMPLIFY_APP_ID: ${{ vars.AMPLIFY_PREVIEW_APP_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  PREVIEW_DOMAIN: ${{ vars.AMPLIFY_PREVIEW_DOMAIN }}

jobs:
  debug-domain:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: amplify-domain-${{ vars.AMPLIFY_PREVIEW_APP_ID }}
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREVIEW_DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Toggle preview subdomain (debug)
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          PREFIX="${BRANCH_NAME//\//-}"
          PREFIX="${PREFIX//./-}"
          PREFIX="${PREFIX//_/-}"

          echo "=== Inputs ==="
          echo "AMPLIFY_APP_ID=$AMPLIFY_APP_ID"
          echo "PREVIEW_DOMAIN=$PREVIEW_DOMAIN"
          echo "BRANCH_NAME=$BRANCH_NAME"
          echo "PREFIX=$PREFIX"

          CURRENT=$(aws amplify get-domain-association \
            --app-id "$AMPLIFY_APP_ID" \
            --domain-name "$PREVIEW_DOMAIN" \
            --query 'domainAssociation.subDomains[].subDomainSetting' \
            --output json)

          echo "=== Current subdomains ==="
          echo "$CURRENT" | jq .

          if echo "$CURRENT" | jq -e --arg prefix "$PREFIX" 'any(.prefix == $prefix)' >/dev/null; then
            ACTION="detach"
            UPDATED=$(echo "$CURRENT" | jq --arg prefix "$PREFIX" \
              'map(select(.prefix != $prefix))')
          else
            ACTION="attach"
            UPDATED=$(echo "$CURRENT" | jq --arg prefix "$PREFIX" --arg branch "$BRANCH_NAME" \
              'map(select(.prefix != $prefix)) + [{prefix: $prefix, branchName: $branch}]')
          fi

          echo "=== Action: $ACTION ==="
          echo "=== Updated payload (JSON) ==="
          echo "$UPDATED" | jq .

          echo "=== Existing Amplify branches ==="
          EXISTING=$(aws amplify list-branches \
            --app-id "$AMPLIFY_APP_ID" \
            --query 'branches[].branchName' \
            --output json)
          echo "$EXISTING" | jq '. | sort'
          echo "Branch count: $(echo "$EXISTING" | jq 'length')"

          echo "=== Orphans (in domain association but missing from Amplify branches) ==="
          ORPHANS=$(jq -n --argjson updated "$UPDATED" --argjson existing "$EXISTING" '
            ($existing | map({(.):true}) | add // {}) as $set
            | $updated | map(select(.branchName | in($set) | not))
          ')
          echo "$ORPHANS" | jq .
          echo "Orphan count: $(echo "$ORPHANS" | jq 'length')"

          echo "=== Skipping update-domain-association (debug only) ==="

  deploy:
    if: false
    runs-on: ubuntu-latest
    outputs:
      job-id: ${{ steps.start-build.outputs.job-id }}
      branch-name: ${{ steps.vars.outputs.branch-name }}
      domain-safe-branch: ${{ steps.vars.outputs.domain-safe-branch }}
      preview-url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREVIEW_DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set variables
        id: vars
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          DOMAIN_SAFE_BRANCH="${BRANCH_NAME//\//-}"
          DOMAIN_SAFE_BRANCH="${DOMAIN_SAFE_BRANCH//./-}"
          DOMAIN_SAFE_BRANCH="${DOMAIN_SAFE_BRANCH//_/-}"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "domain-safe-branch=$DOMAIN_SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Ensure Amplify branch exists
        run: |
          if ! aws amplify get-branch \
              --app-id "${{ env.AMPLIFY_APP_ID }}" \
              --branch-name "${{ steps.vars.outputs.branch-name }}" \
              >/dev/null 2>&1; then
            echo "Branch not found in Amplify, creating..."
            aws amplify create-branch \
              --app-id "${{ env.AMPLIFY_APP_ID }}" \
              --branch-name "${{ steps.vars.outputs.branch-name }}" \
              --stage PULL_REQUEST \
              --framework "Next.js - SSR" \
              --no-enable-auto-build
          else
            echo "Branch already exists in Amplify"
          fi

      - name: Cancel running builds
        run: |
          RUNNING_JOBS=$(aws amplify list-jobs \
            --app-id ${{ env.AMPLIFY_APP_ID }} \
            --branch-name ${{ steps.vars.outputs.branch-name }} \
            --max-results 5 \
            --query 'jobSummaries[?status==`PENDING` || status==`PROVISIONING` || status==`RUNNING`].jobId' \
            --output text)

          for JOB_ID in $RUNNING_JOBS; do
            echo "Stopping job: $JOB_ID"
            aws amplify stop-job \
              --app-id ${{ env.AMPLIFY_APP_ID }} \
              --branch-name ${{ steps.vars.outputs.branch-name }} \
              --job-id $JOB_ID || true
          done

      - name: Start build
        id: start-build
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id ${{ env.AMPLIFY_APP_ID }} \
            --branch-name ${{ steps.vars.outputs.branch-name }} \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "job-id=$JOB_ID" >> $GITHUB_OUTPUT

      - name: Get preview URL
        id: get-url
        run: |
          echo "url=https://${{ steps.vars.outputs.domain-safe-branch }}.${{ env.PREVIEW_DOMAIN }}" >> $GITHUB_OUTPUT

      - name: Post initial comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.get-url.outputs.url }}
        with:
          script: |
            const marker = '<!-- amplify-preview-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes(marker));

            const now = new Date();
            const formatted = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
              ' at ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) + ' (UTC)';

            const body = `${marker}
            ## Preview Deployment

            | Branch | Status | Preview | Updated |
            |--------|--------|----------------|----------|
            | \`${{ steps.vars.outputs.branch-name }}\` | ⏳ Starting | [Visit preview](${process.env.PREVIEW_URL}) | ${formatted} |

            [View Build Logs →](https://${{ env.AWS_REGION }}.console.aws.amazon.com/amplify/apps/${{ env.AMPLIFY_APP_ID }}/branches/${{ steps.vars.outputs.domain-safe-branch }}/deployments/${{ steps.start-build.outputs.job-id }})`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  domain-attach:
    needs: deploy
    if: false
    runs-on: ubuntu-latest
    concurrency:
      group: amplify-domain-${{ vars.AMPLIFY_PREVIEW_APP_ID }}
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREVIEW_DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Attach preview subdomain
        env:
          BRANCH_NAME: ${{ needs.deploy.outputs.branch-name }}
          PREFIX: ${{ needs.deploy.outputs.domain-safe-branch }}
        run: |
          set -euo pipefail

          CURRENT=$(aws amplify get-domain-association \
            --app-id "$AMPLIFY_APP_ID" \
            --domain-name "$PREVIEW_DOMAIN" \
            --query 'domainAssociation.subDomains[].subDomainSetting' \
            --output json)

          UPDATED=$(echo "$CURRENT" | jq --arg prefix "$PREFIX" --arg branch "$BRANCH_NAME" \
            'map(select(.prefix != $prefix)) + [{prefix: $prefix, branchName: $branch}]')

          if [ "$(echo "$CURRENT" | jq -S .)" = "$(echo "$UPDATED" | jq -S .)" ]; then
            echo "Subdomain $PREFIX already attached to $BRANCH_NAME"
            exit 0
          fi

          SHORTHAND=$(echo "$UPDATED" | jq -r '.[] | "prefix=\(.prefix),branchName=\(.branchName)"' | tr '\n' ' ')

          echo $SHORTHAND

          aws amplify update-domain-association \
            --app-id "$AMPLIFY_APP_ID" \
            --domain-name "$PREVIEW_DOMAIN" \
            --sub-domain-settings $SHORTHAND

          echo "Attached $PREFIX -> $BRANCH_NAME"

  monitor:
    needs: deploy
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREVIEW_DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Monitor build and update comment
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ needs.deploy.outputs.job-id }}
          BRANCH_NAME: ${{ needs.deploy.outputs.branch-name }}
          DOMAIN_SAFE_BRANCH: ${{ needs.deploy.outputs.domain-safe-branch }}
          PREVIEW_URL: ${{ needs.deploy.outputs.preview-url }}
        with:
          script: |
            const { execSync } = require('child_process');
            const marker = '<!-- amplify-preview-comment -->';

            const getJobStatus = () => {
              const output = execSync(
                `aws amplify get-job --app-id ${process.env.AMPLIFY_APP_ID} --branch-name "${process.env.BRANCH_NAME}" --job-id ${process.env.JOB_ID} --region ${process.env.AWS_REGION} --output json`,
                { encoding: 'utf-8' }
              );
              return JSON.parse(output).job.summary;
            };

            const updateComment = async (status, url = null, duration = null) => {
              const statusConfig = {
                PENDING: { icon: '⏳', text: 'Pending' },
                PROVISIONING: { icon: '🔧', text: 'Provisioning' },
                RUNNING: { icon: '🔨', text: 'Building' },
                SUCCEED: { icon: '✅', text: 'Ready' },
                FAILED: { icon: '❌', text: 'Failed' },
                CANCELLED: { icon: '⭕', text: 'Cancelled' }
              };

              const config = statusConfig[status] || { icon: '○', text: 'Unknown' };

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(c => c.body.includes(marker));
              const urlCell = url ? `[Visit preview](${url})` : '-';

              const now = new Date();
              const formatted = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
                ' at ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) + ' (UTC)';

              const body = `${marker}
            ## Preview Deployment

            | Branch | Status | Preview | Updated |
            |--------|--------|----------------|----------|
            | \`${process.env.BRANCH_NAME}\` | ${config.icon} ${config.text} | ${urlCell} | ${formatted} |

            [View Build Logs →](https://${process.env.AWS_REGION}.console.aws.amazon.com/amplify/apps/${process.env.AMPLIFY_APP_ID}/branches/${process.env.DOMAIN_SAFE_BRANCH}/deployments/${process.env.JOB_ID})`;

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            };

            let status = 'PENDING';
            const startTime = Date.now();
            const maxWaitTime = 10 * 60 * 1000; // 10 minutes

            while (true) {
              const job = getJobStatus();
              status = job.status;

              const duration = Math.round((Date.now() - startTime) / 1000);
              const durationStr = `${Math.floor(duration / 60)}m ${duration % 60}s`;

              await updateComment(status, process.env.PREVIEW_URL, durationStr);

              if (['SUCCEED', 'FAILED', 'CANCELLED'].includes(status)) {
                if (status === 'FAILED') {
                  core.setFailed('Amplify build failed');
                }
                break;
              }

              if (Date.now() - startTime > maxWaitTime) {
                await updateComment('FAILED', process.env.PREVIEW_URL, durationStr);
                core.setFailed('Build timeout after 10 minutes');
                break;
              }

              await new Promise(resolve => setTimeout(resolve, 20000)); // Wait 20s
            }

  # Branch auto-creation is disabled on the Amplify app (to stay under the 50-branch quota),
  # so on PR close we explicitly detach the preview subdomain (domain-detach) and then
  # delete the Amplify branch (cleanup). The detach is serialized across PRs because
  # update-domain-association rewrites a single shared resource.
  domain-detach:
    if: false
    runs-on: ubuntu-latest
    concurrency:
      group: amplify-domain-${{ vars.AMPLIFY_PREVIEW_APP_ID }}
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREVIEW_DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detach preview subdomain
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          PREFIX="${BRANCH_NAME//\//-}"
          PREFIX="${PREFIX//./-}"
          PREFIX="${PREFIX//_/-}"

          CURRENT=$(aws amplify get-domain-association \
            --app-id "$AMPLIFY_APP_ID" \
            --domain-name "$PREVIEW_DOMAIN" \
            --query 'domainAssociation.subDomains[].subDomainSetting' \
            --output json)

          UPDATED=$(echo "$CURRENT" | jq --arg prefix "$PREFIX" 'map(select(.prefix != $prefix))')

          if [ "$(echo "$CURRENT" | jq -S .)" = "$(echo "$UPDATED" | jq -S .)" ]; then
            echo "Subdomain $PREFIX already absent"
            exit 0
          fi

          SHORTHAND=$(echo "$UPDATED" | jq -r '.[] | "prefix=\(.prefix),branchName=\(.branchName)"' | tr '\n' ' ')

          if [ -z "$SHORTHAND" ]; then
            echo "Refusing to update domain association to an empty subdomain list — skipping detach"
            exit 0
          fi

          aws amplify update-domain-association \
            --app-id "$AMPLIFY_APP_ID" \
            --domain-name "$PREVIEW_DOMAIN" \
            --sub-domain-settings $SHORTHAND

          echo "Detached $PREFIX"

  cleanup:
    if: false
    needs: domain-detach
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREVIEW_DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete Amplify branch
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Deleting Amplify branch: $BRANCH_NAME"
          aws amplify delete-branch \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "$BRANCH_NAME" || \
            echo "Branch already deleted or never existed — continuing"

      - name: Update comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- amplify-preview-comment -->';

            const now = new Date();
            const formatted = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
              ' at ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) + ' (UTC)';

            const body = `${marker}
            ## Preview Deployment

            | Branch | Status | Preview | Updated |
            |--------|--------|----------------|----------|
            | \`${{ github.head_ref }}\` | ❌ Deleted | - | ${formatted} |`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes(marker));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            }
