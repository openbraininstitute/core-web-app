version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        COMMIT_SHA: ${COMMIT_SHA:-latest}
    image: cwa:${COMMIT_SHA:-latest}
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      # Override for development
      NODE_ENV: development
    stdin_open: true
    tty: true
    container_name: core-web-app-dev
    restart: unless-stopped
    develop:
      watch:
        # Sync source code changes (without restart)
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        # Restart container when package files change
        - action: restart
          path: ./package.json
        - action: restart
          path: ./pnpm-lock.yaml
        # Sync config changes
        - action: sync
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync
          path: ./tailwind.config.ts
          target: /app/tailwind.config.ts
        - action: restart
          path: ./src/entity-configuration/domain/simulation/
          target: /app/src/entity-configuration/domain/simulation/
        # Ignore build outputs and dependencies
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .turbo/
            - coverage/
            - test-results/
            - playwright-report/
            - .vscode/
            - .idea/
