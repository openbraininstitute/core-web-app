version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Node.js $(node -v)"
        - npm install -g pnpm@11.25.0
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - export APP_VERSION=$(make version)
        - |
          sanitize_branch() {
            echo "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g' \
              | sed -E 's/^-+|-+$//g' \
              | cut -c1-63
          }

          SANITIZED_BRANCH=$(sanitize_branch "$AWS_BRANCH")
          PREVIEW_DOMAIN="${SANITIZED_BRANCH}.preview.openbraininstitute.org"
          # Better Auth expects the bare origin (its basePath is /api/auth).
          export BETTER_AUTH_URL="https://${PREVIEW_DOMAIN}"
          # Reuse the existing NEXTAUTH_SECRET console var as the Better Auth
          # secret so no Amplify environment change is required for the migration.
          export BETTER_AUTH_SECRET="${NEXTAUTH_SECRET}"

        - env | grep -e APP_VERSION -e DEPLOYMENT_ENV -e API_ORIGIN -e
          STRIPE_PUBLISHABLE_KEY -e SANITY_DATASET -e KEYCLOAK_CLIENT_ID -e
          KEYCLOAK_CLIENT_SECRET -e KEYCLOAK_ISSUER -e NOTEBOOK_REPO_URL -e
          BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e AUTH_PROXY_URL -e
          GRADING_WEB_LAUNCH_HMAC_SECRET >> .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - standalone/**
      - static/**
      - BUILD_ID
  cache:
    paths:
      - .next/cache/**/*
      - .pnpm-store/**/*
