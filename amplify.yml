version: 1
# Monorepo app: commands run in appRoot. Amplify also needs AMPLIFY_MONOREPO_APP_ROOT=apps/web
# in the app's environment variables (console setting, not in this file).
applications:
  - appRoot: apps/web
    env:
      variables:
        # AWS requires a hoisted node_modules for pnpm monorepos on Amplify; pnpm 11 ignores
        # node-linker in .npmrc, so it is set here (Amplify only, other installs stay isolated)
        pnpm_config_node_linker: hoisted
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Node.js $(node -v)"
            - npm install -g pnpm@$(node -p "require('../../package.json').packageManager.split('@')[1]")
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - export APP_VERSION=$(make --no-print-directory -C ../.. version)
            - |
              sanitize_branch() {
                echo "$1" \
                  | tr '[:upper:]' '[:lower:]' \
                  | sed -E 's/[^a-z0-9]+/-/g' \
                  | sed -E 's/^-+|-+$//g' \
                  | cut -c1-63
              }

              SANITIZED_BRANCH=$(sanitize_branch "$AWS_BRANCH")
              PREVIEW_DOMAIN="${SANITIZED_BRANCH}.preview.openbraininstitute.org"
              export NEXTAUTH_URL="https://${PREVIEW_DOMAIN}/api/auth"

            - env | grep -e APP_VERSION -e DEPLOYMENT_ENV -e API_ORIGIN -e
              STRIPE_PUBLISHABLE_KEY -e SANITY_DATASET -e KEYCLOAK_CLIENT_ID -e
              KEYCLOAK_CLIENT_SECRET -e KEYCLOAK_ISSUER -e NOTEBOOK_REPO_URL -e
              NEXTAUTH_SECRET -e NEXTAUTH_URL -e AUTH_PROXY_URL -e
              GRADING_WEB_LAUNCH_HMAC_SECRET >> .env.production
            - pnpm run build
        postBuild:
          commands:
            # Amplify's Next.js deploy needs .next/standalone/server.js; in the monorepo Next nests
            # the app under standalone/apps/web. Lift it, copying link targets (-L) because the
            # links in .next/node_modules point to ../../node_modules relative to the nested path.
            - cp -RL .next/standalone/apps/web/. .next/standalone/
            - rm -rf .next/standalone/apps
      artifacts:
        baseDirectory: .next
        files:
          - standalone/**
          - static/**
          - BUILD_ID
      cache:
        paths:
          - .next/cache/**/*
          - .pnpm-store/**/*
