version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - export APP_VERSION=$(make version)
        - |
          sanitize_branch() {
            echo "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g' \
              | sed -E 's/^-+|-+$//g' \
              | cut -c1-63
          }

          SANITIZED_BRANCH=$(sanitize_branch "$AWS_BRANCH")
          PREVIEW_DOMAIN="${SANITIZED_BRANCH}.preview.openbraininstitute.org"
          export NEXTAUTH_URL="https://${PREVIEW_DOMAIN}/api/auth"
          export AUTH_PROXY_URL="https://auth.preview.openbraininstitute.org"

          echo "Sanitized branch: $SANITIZED_BRANCH"
          echo "NEXTAUTH_URL set to: $NEXTAUTH_URL"
        - env | grep -e APP_VERSION -e DEPLOYMENT_ENV -e API_ORIGIN -e
          STRIPE_PUBLISHABLE_KEY -e SANITY_DATASET -e KEYCLOAK_CLIENT_ID -e
          KEYCLOAK_CLIENT_SECRET -e KEYCLOAK_ISSUER -e NOTEBOOK_REPO_URL -e
          NEXTAUTH_SECRET -e NEXTAUTH_URL -e AUTH_PROXY_URL >> .env.production
        - env
        - cat .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - standalone/**
      - static/**
      - BUILD_ID
  cache:
    paths:
      - .next/cache/**/*
      - .pnpm-store/**/*
