services:
  # Frontend - Core Web App
  frontend:
    container_name: core-web-app-frontend
    build:
      context: ..
      dockerfile: Dockerfile.dev
      args:
        COMMIT_SHA: ${COMMIT_SHA:-latest}
    image: cwa:${COMMIT_SHA:-latest}
    ports:
      - '3000:3000'
    env_file:
      - ../.env.local  # Your existing .env.local file
      # - .env.fullstack  # Alternative: dedicated fullstack env file
    environment:
      # Override for development
      NODE_ENV: development
      # Point to the backend service (use localhost for browser access)
      NEXT_PUBLIC_ENTITY_CORE_URL: http://localhost:8000
      # Keycloak configuration for development
      KEYCLOAK_ISSUER: https://staging.openbraininstitute.org/auth/realms/SBO
      KEYCLOAK_CLIENT_ID: obp-core-web-app-dev
      KEYCLOAK_CLIENT_SECRET: dummy-secret
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        # Sync source code changes (without restart)
        - action: sync
          path: ../src
          target: /app/src
        - action: sync
          path: ../public
          target: /app/public
        # Restart container when package files change
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../pnpm-lock.yaml
        # Sync config changes
        - action: sync
          path: ../next.config.ts
          target: /app/next.config.ts
        - action: sync
          path: ../tailwind.config.ts
          target: /app/tailwind.config.ts
        - action: sync+restart
          path: ../src/entity-configuration/domain/simulation/
          target: /app/src/entity-configuration/domain/simulation/
        # Ignore build outputs and dependencies
        - action: sync
          path: ../
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .turbo/
            - coverage/
            - test-results/
            - playwright-report/
            - .vscode/
            - .idea/

  # Backend - Entity Core
  backend:
    container_name: entitycore-backend
    build:
      context: ../../entitycore
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
        APP_NAME: entitycore
        APP_VERSION: 0.0.0
        COMMIT_SHA: ${COMMIT_SHA:-latest}
    image: entitycore:${COMMIT_SHA:-latest}
    ports:
      - '8000:8000'
    environment:
      # Database configuration
      DATABASE_URL: postgresql://entitycore:entitycore@db:5432/entitycore
      # MinIO configuration
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: entitycore
      S3_SECRET_ACCESS_KEY: entitycore
      S3_BUCKET_NAME: entitycore-data-dev
      # Application configuration
      ENVIRONMENT: development
      APP_NAME: entitycore
      APP_VERSION: 0.0.0
      COMMIT_SHA: ${COMMIT_SHA:-latest}
      # CORS configuration for frontend access
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Keycloak configuration for token validation
      KEYCLOAK_URL: https://staging.openbraininstitute.org/auth/realms/SBO
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend-startup.sh:/code/backend-startup.sh:ro
      # Mount dump file for restoration
      - ${DB_DUMP_FILE:-./data/entitycore_dump.dump}:/data/dump.dump:ro
    command: /bin/bash /code/backend-startup.sh
    develop:
      watch:
        - action: sync+restart
          path: ../../entitycore/app
          target: /code/app

  # Database - PostgreSQL
  db:
    container_name: entitycore-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: entitycore
      POSTGRES_PASSWORD: entitycore
      POSTGRES_DB: entitycore
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitycore -d entitycore"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 2s
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../entitycore/data:/data
      # Mount database dump file if provided via DB_DUMP_FILE environment variable
      - ${DB_DUMP_FILE:-./data/entitycore_dump.dump}:/data/dump.dump:ro
    command:
      - postgres
      - -clog_min_duration_statement=100ms
      - -clog_lock_waits=on

  # MinIO - S3 Compatible Storage
  minio:
    container_name: entitycore-minio
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: entitycore
      MINIO_ROOT_PASSWORD: entitycore
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3data:/data
    entrypoint: sh
    command:
      - -cx
      - |
        mkdir -p /data/entitycore-data-dev &&
        minio server /data --console-address :9001
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  s3data:
    driver: local

networks:
  default:
    name: fullstack-network
    driver: bridge
