overrides:
  # CodeMirror requires a single @codemirror/state instance across all packages.
  # Transitive deps pulled in both 6.6.0 and 6.7.x, which broke EditorState.create
  # with "Unrecognized extension value". Force one copy.
  "@codemirror/state": "6.7.6"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  es5-ext: true
  esbuild: true
  lefthook: true
  sharp: true

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@openbraininstitute/*'
  - '@tolokoban/tgd'
  - '@next/env@16.3.0 || 16.3.3'
  - '@next/swc-darwin-arm64@16.3.0 || 16.3.3'
  - '@next/swc-darwin-x64@16.3.0 || 16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.0 || 16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.0 || 16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.0 || 16.3.3'
  - '@next/swc-linux-x64-musl@16.3.0 || 16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.0 || 16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.0 || 16.3.3'
  - next@16.3.0 || 16.3.3
blockExoticSubdeps: true
verifyDepsBeforeRun: error
